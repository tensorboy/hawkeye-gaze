# Fastest config for verifying the training pipeline runs end-to-end.
# Uses ResNet-50 (no extra downloads beyond torchvision) and a generic CSV-format
# dataset so you can point it at any small handmade dataset to smoke-test the loop.

backbone: resnet50
epochs: 2
batch_size: 16
num_workers: 2
grad_clip: 1.0
seed: 42
amp: true
log_interval: 10
eval_interval: 50
ckpt_dir: checkpoints
run_name: resnet50_smoke

optim:
  backbone_lr: 1.0e-4
  head_lr: 1.0e-3
  weight_decay: 1.0e-4
  warmup_steps: 50

loss:
  ce_weight: 1.0
  mse_weight: 1.0

data:
  type: label_file
  label_file_train: data/sample_train.csv
  label_file_val: data/sample_val.csv
  image_root: data/images
  delimiter: ","
  input_size: 224
  mean: [0.485, 0.456, 0.406]   # ImageNet normalization for ResNet
  std: [0.229, 0.224, 0.225]
  hflip_prob: 0.5
  color_jitter: 0.2

wandb_project: null
