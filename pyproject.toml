[project]
name = "hawkeye-gaze"
version = "0.0.1"
description = "End-to-end trainable gaze estimation for macOS"
requires-python = ">=3.12"
dependencies = [
    "torch>=2.4",
    "torchvision>=0.19",
    "transformers>=4.45",
    "timm>=1.0.11",
    "pillow>=10.4",
    "numpy>=2.0",
    "opencv-python>=4.10",
    "pyyaml>=6.0",
    "tqdm>=4.66",
    "einops>=0.8",
    "wandb>=0.18",
    "scikit-learn>=1.5",
    "matplotlib>=3.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.7",
]
coreml = [
    "coremltools>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gaze"]

[tool.ruff]
line-length = 100
target-version = "py312"
